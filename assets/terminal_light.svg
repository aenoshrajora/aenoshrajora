<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <clipPath id="clip-light"><rect x="0" y="0" width="640" height="400" rx="12"/></clipPath>
  </defs>

  <style>
    .prompt   { fill: #1f8a3d; font-weight: 700; }
    .txt      { fill: #2b3140; }
    .dim      { fill: #8891a1; }
    .accent   { fill: #1f8a3d; font-weight: 600; }
    .label    { fill: #2f6fd6; }
    .title    { fill: #101318; font-weight: 700; }
    .cursor   { fill: #1f8a3d; font-weight: 600; }
  </style>

  <g clip-path="url(#clip-light)">
    <rect width="640" height="400" fill="url(#bg-light)"/>
    <rect x="0" y="0" width="640" height="32" fill="#e4e8f0"/>
    <circle cx="22" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="16" r="6" fill="#27c93f"/>
    <text x="320" y="21" text-anchor="middle" class="dim" font-size="13">aenosh@thecyberledger: ~</text>
    <rect x="0" y="32" width="640" height="1" fill="#d7dce6"/>

    <!-- generate_stats.py replaces the contents of this <g> with the
         typed-character SVG fragment it builds from live stats -->
    <g id="typed-lines" xml:space="preserve" font-size="15"></g>

    <rect x="0" y="0" width="640" height="400" fill="none" stroke="#d7dce6" stroke-width="1" rx="12"/>
  </g>
</svg>
