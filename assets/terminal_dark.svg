<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10151d"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <clipPath id="clip-dark"><rect x="0" y="0" width="640" height="400" rx="12"/></clipPath>
  </defs>

  <style>
    .scan { animation: scan-dark 6s linear infinite; }
    @keyframes scan-dark { from { transform: translateY(-400px); } to { transform: translateY(400px); } }
    .prompt   { fill: #9fef00; font-weight: 700; }
    .txt      { fill: #c3cbdc; }
    .dim      { fill: #5c6472; }
    .accent   { fill: #9fef00; font-weight: 600; }
    .label    { fill: #6d99ff; }
    .title    { fill: #e8ecf5; font-weight: 700; }
    .cursor   { fill: #9fef00; font-weight: 600; }
  </style>

  <g clip-path="url(#clip-dark)">
    <rect width="640" height="400" fill="url(#bg-dark)"/>
    <rect x="0" y="0" width="640" height="32" fill="#161b22"/>
    <circle cx="22" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="16" r="6" fill="#27c93f"/>
    <text x="320" y="21" text-anchor="middle" class="dim" font-size="13">aenosh@thecyberledger: ~</text>
    <rect x="0" y="32" width="640" height="1" fill="#242b36"/>

    <rect x="0" y="32" width="640" height="60" fill="#9fef00" opacity="0.05" class="scan"/>

    <!-- generate_stats.py replaces the contents of this <g> with the
         typed-character SVG fragment it builds from live stats -->
    <g id="typed-lines" xml:space="preserve" font-size="15"></g>

    <rect x="0" y="0" width="640" height="400" fill="none" stroke="#242b36" stroke-width="1" rx="12"/>
  </g>
</svg>
